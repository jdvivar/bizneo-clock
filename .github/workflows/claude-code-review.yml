name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      statuses: write
    steps:
      - id: start
        name: Mark the merge gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context="Claude review" -f description="Reviewing"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first and hold the change to
            its conventions, and to docs/DESIGN.md for the area touched,
            especially the gotchas in its section 5.

            Report correctness bugs first, then violations of the repo's rules.
            Skip style nits and praise.

            Give every issue a severity:
            - critical: records the wrong clock state or time (clocks in, out or
              pauses when it shouldn't, or reports success when the action
              failed), crashes, leaks the session cookie or other credentials,
              or breaks the release/publish pipeline
            - major: wrong behaviour a user would hit, or a broken repo rule
              (e.g. the exit-code contract, company-agnostic code, no code
              comments, Conventional Commits)
            - minor: edge case, unclear code, missing verification

            Post each issue as an inline comment with
            mcp__github_inline_comment__create_inline_comment, starting with its
            severity in brackets, e.g. "[major] ...".

            Then post one summary with `gh pr comment`, in this shape:

            **Confidence to merge: N/5**
            One sentence on why.

            | Severity | Count |
            |---|---|
            | critical | n |
            | major | n |
            | minor | n |

            Then one line per issue: severity, file:line, what is wrong.

            Score from the worst issue found:
            5 = no issues; 4 = minor only; 3 = one major;
            2 = several majors; 1 = any critical.
            If nothing survives, post the score and the line "No issues found."
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Merging needs 5/5. A missing score fails too: a review that silently
      # did not happen must not look like a clean one.
      - name: Gate merging on the score
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.time }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          score=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$SINCE&per_page=100" \
            --jq '[.[] | select(.user.login == "claude[bot]") | .body
                   | capture("Confidence to merge: (?<n>[1-5])/5") | .n] | last // empty' | tail -n 1)
          if [ -z "$score" ]; then
            state=failure; desc="No score posted, the review did not finish"
          elif [ "$score" = 5 ]; then
            state=success; desc="5/5"
          else
            state=failure; desc="$score/5, needs 5/5 or @claude override"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" \
            -f context="Claude review" -f description="$desc" -f target_url="$RUN_URL"
