name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish main's package.json version to npm (recovery, if a release was tagged but not published)"
        type: boolean
        default: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
      - run: npm ci
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
      - run: npm publish --access public
        if: ${{ steps.release.outputs.release_created || inputs.publish }}
